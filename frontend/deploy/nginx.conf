# Example nginx config for serving the CodeLens frontend and proxying the API.
# Host it on the internal network / behind VPN or zero-trust access — CodeLens is not a public site.
# Adjust server_name, certificate paths and the backend upstream for your environment.

upstream codelens_backend {
    server codelens-backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name codelens.internal.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name codelens.internal.example.com;

    ssl_certificate     /etc/nginx/tls/codelens.crt;
    ssl_certificate_key /etc/nginx/tls/codelens.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 1m;

    root /usr/share/nginx/html;   # contents of `npm run build` (dist/)

    # Fingerprinted assets: cache forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # API: never cached; streaming answers need buffering off.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;

        proxy_pass http://codelens_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # Server-Sent Events
        proxy_cache off;
        proxy_read_timeout 300s;      # long-running warehouse queries
    }

    # Single-page app: unknown paths serve index.html, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
