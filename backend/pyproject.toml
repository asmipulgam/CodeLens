[project]
name = "codelens-backend"
version = "0.1.0"
description = "CodeLens backend: natural-language querying across company databases"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "azure-identity>=1.27.0",
    "azure-keyvault-secrets>=4.12.0",
    "cryptography>=50.0.2",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "joserfc>=1.8.0",
    "langchain-core>=1.8.1",
    "langchain-openai>=1.8.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.2.4",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "sqlglot>=30.32.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.40.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
    "types-pymysql>=1.2.4.20261116",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
